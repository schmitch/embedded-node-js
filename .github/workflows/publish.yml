name: build-and-pack

on:
  push:
    branches: [ "main-v26" ]
    # Node 26 releases are tagged node26-vX.Y.Z; the plain vX.Y.Z tags belong to main (Node 24).
    tags: [ "node26-v*" ]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_VERSION: "9.0.x"
  NODE_VERSION: "26.12.1"

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build src/NodeJs.Embedded/NodeJs.Embedded.csproj -c Release

      - name: Download Node binaries
        run: ./scripts/download-node.sh $NODE_VERSION

      - name: Verify downloaded binaries
        run: |
          set -euo pipefail
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            path="src/NodeJs.Embedded.Native.${rid}/runtimes/${rid}/native"
            ls -l "$path" || { echo "Missing files for $rid in $path"; exit 1; }
            if ! ls "$path"/node* >/dev/null 2>&1; then
              echo "No node binary found in $path"
              exit 1
            fi
          done

      - name: Determine package version
        run: |
          VERSION="0.2.0"
          if [[ "${GITHUB_REF:-}" == refs/tags/node26-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/node26-v}"
          fi
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Package version: $VERSION"

      - name: Pack NuGet
        run: |
          dotnet pack src/NodeJs.Embedded/NodeJs.Embedded.csproj -c Release -o artifacts /p:Version=$PACKAGE_VERSION /p:EmbeddedNodeJsNativeVersion=$PACKAGE_VERSION
          for proj in src/NodeJs.Embedded.Native.*/NodeJs.Embedded.Native.*.csproj; do
            dotnet pack "$proj" -c Release -o artifacts /p:Version=$PACKAGE_VERSION
          done

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: embedded-nodejs-nugets
          path: artifacts/*.nupkg

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: embedded-nodejs-symbols
          path: artifacts/*.snupkg

  publish:
    # Push events only reach this workflow for this branch's release tags (see on.push.tags).
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write # lets NuGet/login request the GitHub OIDC token nuget.org checks
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: embedded-nodejs-*
          merge-multiple: true
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet login (OIDC -> temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --skip-duplicate --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
